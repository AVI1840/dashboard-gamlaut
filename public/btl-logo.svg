    <path d="M22 16c2 0 4 2 5 5l1 4h-2l-1-3.5c-0.5-2-2-3.5-3.5-3.5" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M18 18c2 0 4 3 5 6l1 4h-2l-1-3.5c-0.5-2-2-4-3.5-4" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Right branches -->
